<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
:root{--surface:#F7F7F8;--text:#171717;--text-muted:#52525B;--border:rgba(23,23,23,.12);--chart-series-1:#02743B;--chart-series-2:#85FABF;--chart-series-3:#0FDC78;--chart-series-4:#80C1FF;--danger:#E8463A}
body{margin:0;padding:24px;background:#FFFFFF}
.w{width:900px;box-sizing:border-box;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;font:400 14px/20px "SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.w h3{font:500 16px/24px "SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;margin:0 0 8px}
.sub{font:400 12px/18px "SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--text-muted);margin:0 0 12px}
.grid line{stroke:var(--border);stroke-width:1}
.ln1{stroke:var(--chart-series-1);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln2{stroke:var(--chart-series-2);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 4}
.ln3{stroke:var(--chart-series-3);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln4{stroke:var(--chart-series-4);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 4}
.thr{stroke:var(--danger);stroke-width:1.5;stroke-dasharray:6 4}
.ax{fill:var(--text-muted);font:400 12px "SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.d1{fill:var(--chart-series-1);stroke:var(--surface);stroke-width:1.5}
.d3{fill:var(--chart-series-3);stroke:var(--surface);stroke-width:1.5}
.leg{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:12px;font:400 12px "SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--text-muted)}
.leg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.k1{background:var(--chart-series-1)}.k2{background:var(--chart-series-2)}.k3{background:var(--chart-series-3)}.k4{background:var(--chart-series-4)}.k5{background:var(--danger)}
</style>
</head>
<body>
<div class="w">
<h3>TPOT / ITL × 输出长度</h3>
<p class="sub">对数轴（ms）· 输入 512 · 并发 32 · 13 档 · 红虚线 = 30ms 判定线 · ITL 为 aisbench 原生统计</p>
<svg viewBox="0 0 660 300" style="width:100%;height:auto" role="img">
<g class="grid">
<line x1="50" y1="30" x2="620" y2="30"/><line x1="50" y1="69" x2="620" y2="69"/><line x1="50" y1="128" x2="620" y2="128"/><line x1="50" y1="250" x2="620" y2="250"/>
</g>
<line class="thr" x1="50" y1="197.5" x2="620" y2="197.5"/>
<g class="ax">
<text x="42" y="254" text-anchor="end">10</text><text x="42" y="201" text-anchor="end">30</text><text x="42" y="132" text-anchor="end">100</text><text x="42" y="73" text-anchor="end">300</text><text x="42" y="34" text-anchor="end">1000</text>
<text x="50" y="270" text-anchor="middle">64</text><text x="97.5" y="270" text-anchor="middle">128</text><text x="145" y="270" text-anchor="middle">256</text><text x="192.5" y="270" text-anchor="middle">512</text><text x="240" y="270" text-anchor="middle">1K</text><text x="287.5" y="270" text-anchor="middle">2K</text><text x="335" y="270" text-anchor="middle">4K</text><text x="382.5" y="270" text-anchor="middle">8K</text><text x="430" y="270" text-anchor="middle">16K</text><text x="477.5" y="270" text-anchor="middle">32K</text><text x="525" y="270" text-anchor="middle">48K</text><text x="572.5" y="270" text-anchor="middle">56K</text><text x="620" y="270" text-anchor="middle">64K</text>
<text x="335" y="292" text-anchor="middle">输出长度（token）</text>
</g>
<polyline class="ln3" points="50,82.1 97.5,90.5 145,104.3 192.5,114.3 240,124.5 287.5,132.9 335,138.1 382.5,140.8 430,143.5 477.5,143.8 525,143 572.5,143.6 620,142.6"/>
<polyline class="ln1" points="50,141.5 97.5,153.2 145,168.6 192.5,183.3 240,200.6 287.5,211.9 335,223.8 382.5,232.2 430,235.3 477.5,237.5 525,237.1 572.5,237.5 620,237.1"/>
<g class="d3"><circle cx="50" cy="82.1" r="3"/><circle cx="97.5" cy="90.5" r="3"/><circle cx="145" cy="104.3" r="3"/><circle cx="192.5" cy="114.3" r="3"/><circle cx="240" cy="124.5" r="3"/><circle cx="287.5" cy="132.9" r="3"/><circle cx="335" cy="138.1" r="3"/><circle cx="382.5" cy="140.8" r="3"/><circle cx="430" cy="143.5" r="3"/><circle cx="477.5" cy="143.8" r="3"/><circle cx="525" cy="143" r="3"/><circle cx="572.5" cy="143.6" r="3"/><circle cx="620" cy="142.6" r="3"/></g>
<g class="d1"><circle cx="50" cy="141.5" r="3"/><circle cx="97.5" cy="153.2" r="3"/><circle cx="145" cy="168.6" r="3"/><circle cx="192.5" cy="183.3" r="3"/><circle cx="240" cy="200.6" r="3"/><circle cx="287.5" cy="211.9" r="3"/><circle cx="335" cy="223.8" r="3"/><circle cx="382.5" cy="232.2" r="3"/><circle cx="430" cy="235.3" r="3"/><circle cx="477.5" cy="237.5" r="3"/><circle cx="525" cy="237.1" r="3"/><circle cx="572.5" cy="237.5" r="3"/><circle cx="620" cy="237.1" r="3"/></g>
</svg>
<div class="leg"><span><i class="k1"></i>TPOT avg</span><span><i class="k3"></i>ITL avg</span><span><i class="k5"></i>30ms 判定线</span></div>
</div>
</body>
</html>
